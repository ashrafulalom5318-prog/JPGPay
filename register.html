<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - JPGPay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;650;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f3f7f6;
            user-select: none;
        }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen md:bg-gray-900">

    <div class="relative w-full max-w-md h-screen md:h-[880px] md:rounded-[36px] bg-[#f4f7f9] md:shadow-2xl overflow-hidden flex flex-col p-6 justify-between">
        
        <!-- Header -->
        <div class="flex items-center">
            <a href="login.html" class="text-emerald-800 text-xl"><i class="fa-solid fa-arrow-left"></i></a>
            <h2 class="text-lg font-bold text-[#0a8f5c] mx-auto pr-6">Register</h2>
        </div>

        <!-- Form Fields -->
        <div class="space-y-4 mt-2 flex-1">
            
            <!-- Error message toast -->
            <div id="error-toast" class="hidden bg-red-100 border border-red-200 text-red-700 text-xs px-4 py-3 rounded-xl flex items-center space-x-2">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="error-text"></span>
            </div>

            <!-- Username Input -->
            <div>
                <div class="flex items-center bg-white border border-gray-200 rounded-full px-5 py-3.5 shadow-sm focus-within:border-[#0a8f5c] transition-all">
                    <i class="fa-regular fa-user text-[#0a8f5c] mr-3.5 text-lg"></i>
                    <input type="text" id="username" maxlength="15" placeholder="User Name" class="w-full bg-transparent outline-none text-gray-700 text-sm">
                </div>
                <span class="text-[10px] text-gray-400 mt-1 ml-4 block">Alphabets/Numbers only. Max 15 characters.</span>
            </div>

            <!-- Password Input -->
            <div>
                <div class="flex items-center bg-white border border-gray-200 rounded-full px-5 py-3.5 shadow-sm focus-within:border-[#0a8f5c] transition-all">
                    <i class="fa-solid fa-lock text-[#0a8f5c] mr-3.5 text-lg"></i>
                    <input type="password" id="password" maxlength="20" placeholder="Password" class="w-full bg-transparent outline-none text-gray-700 text-sm">
                </div>
                <span class="text-[10px] text-gray-400 mt-1 ml-4 block">Strict: 6-20 characters with at least one number.</span>
            </div>

            <!-- Phone Input -->
            <div class="flex items-center bg-white border border-gray-200 rounded-full px-5 py-3.5 shadow-sm focus-within:border-[#0a8f5c] transition-all">
                <i class="fa-solid fa-phone text-[#0a8f5c] mr-3 text-lg"></i>
                <span class="text-[#0a8f5c] font-bold text-sm border-r pr-3 mr-3">+91</span>
                <!-- inputType tel helps native keyboard numeric popup -->
                <input type="tel" id="phone" placeholder="Phone" maxlength="10" class="w-full bg-transparent outline-none text-gray-700 text-sm tracking-widest">
            </div>

            <!-- OTP Input Row -->
            <div class="flex items-center bg-white border border-gray-200 rounded-full px-5 py-2.5 shadow-sm focus-within:border-[#0a8f5c] transition-all">
                <i class="fa-regular fa-envelope text-[#0a8f5c] mr-3.5 text-lg"></i>
                <input type="tel" id="otp" placeholder="OTP Code" maxlength="6" class="w-full bg-transparent outline-none text-gray-700 text-sm tracking-widest">
                <button id="send-otp-btn" disabled class="bg-[#9cd3bc] cursor-not-allowed text-white text-xs px-5 py-2 rounded-full font-bold transition-all">Send</button>
            </div>

            <!-- Referral Code -->
            <div class="flex items-center bg-white border border-gray-200 rounded-full px-5 py-3.5 shadow-sm focus-within:border-[#0a8f5c] transition-all">
                <i class="fa-solid fa-link text-[#0a8f5c] mr-3.5 text-lg"></i>
                <input type="text" id="referral" maxlength="6" placeholder="Referral Code (Optional)" class="w-full bg-transparent outline-none text-gray-700 text-sm font-semibold">
            </div>
            <div id="ref-status" class="text-[10px] ml-4 font-bold hidden"></div>

        </div>

        <!-- Submit Button -->
        <button id="signup-btn" onclick="handleSignUp()" class="w-full bg-[#0a8f5c] hover:bg-emerald-800 text-white font-bold py-4 rounded-full shadow-lg shadow-emerald-700/10 transition-all text-center block text-sm tracking-wide mt-6">
            Sign Up
        </button>

        <!-- Invisible Captcha Area for Firebase Auth -->
        <div id="recaptcha-container"></div>

    </div>

    <!-- Script Handling Logic with Config Integrations -->
    <script type="module">
        import { 
            auth, 
            db, 
            RecaptchaVerifier, 
            signInWithPhoneNumber, 
            doc, 
            setDoc, 
            getDoc, 
            query, 
            collection, 
            where, 
            getDocs,
            generateReferralCode
        } from "./services/firebase-config.js";

        const phoneInput = document.getElementById('phone');
        const sendOtpBtn = document.getElementById('send-otp-btn');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const referralInput = document.getElementById('referral');
        const refStatus = document.getElementById('ref-status');

        let confirmationResult = null;

        // Ensure real-time validation of phone input before enabling Send Button
        phoneInput.addEventListener('input', () => {
            phoneInput.value = phoneInput.value.replace(/[^0-9]/g, ''); // Number lock restriction
            if (phoneInput.value.length === 10) {
                sendOtpBtn.disabled = false;
                sendOtpBtn.classList.remove('bg-[#9cd3bc]', 'cursor-not-allowed');
                sendOtpBtn.classList.add('bg-[#0a8f5c]', 'hover:bg-emerald-700');
            } else {
                sendOtpBtn.disabled = true;
                sendOtpBtn.classList.add('bg-[#9cd3bc]', 'cursor-not-allowed');
                sendOtpBtn.classList.remove('bg-[#0a8f5c]', 'hover:bg-emerald-700');
            }
        });

        // Initialize Firebase Invisible reCAPTCHA 
        window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
            'size': 'invisible',
            'callback': (response) => {
                // recaptcha solved
            }
        });

        // Send OTP Event Link
        sendOtpBtn.addEventListener('click', async () => {
            const phoneNumber = "+91" + phoneInput.value;
            showError("", false);

            try {
                // Prevent duplicate user setup before sending SMS
                const userQuery = query(collection(db, "users"), where("phone", "==", phoneInput.value));
                const querySnapshot = await getDocs(userQuery);
                if (!querySnapshot.empty) {
                    showError("This phone number is already registered!");
                    return;
                }

                // Verify username matches standard format limits
                const uname = usernameInput.value.trim();
                const alphanumericRegex = /^[a-zA-Z0-9]+$/;
                if (uname.length < 3 || !alphanumericRegex.test(uname)) {
                    showError("Username must be alphanumeric & 3-15 chars long.");
                    return;
                }

                // Verify safe passwords
                const pass = passwordInput.value;
                const numberRegex = /\d/;
                if (pass.length < 6 || !numberRegex.test(pass)) {
                    showError("Password must be 6-20 characters with at least 1 digit.");
                    return;
                }

                // Trigger Phone Auth SMS send
                const appVerifier = window.recaptchaVerifier;
                confirmationResult = await signInWithPhoneNumber(auth, phoneNumber, appVerifier);
                
                // Show countdown timer / Success state on button
                let count = 60;
                sendOtpBtn.disabled = true;
                const timer = setInterval(() => {
                    sendOtpBtn.innerText = `${count}s`;
                    count--;
                    if (count < 0) {
                        clearInterval(timer);
                        sendOtpBtn.innerText = "Send";
                        sendOtpBtn.disabled = false;
                    }
                }, 1000);

                showError("OTP Sent Successfully!", false, "green");

            } catch (err) {
                showError("Firebase Captcha / SMS Issue: " + err.message);
                console.error(err);
            }
        });

        // Live Validate Referral Input
        referralInput.addEventListener('input', async () => {
            const val = referralInput.value.trim();
            if (val.length === 6) {
                refStatus.classList.remove('hidden');
                refStatus.innerText = "Validating...";
                refStatus.className = "text-[10px] ml-4 font-bold text-amber-500";
                
                const refQuery = query(collection(db, "users"), where("myReferralCode", "==", val));
                const querySnapshot = await getDocs(refQuery);
                
                if (!querySnapshot.empty) {
                    refStatus.innerText = "Valid Referral Code ✔";
                    refStatus.className = "text-[10px] ml-4 font-bold text-emerald-600";
                } else {
                    refStatus.innerText = "Referral Code not found ✖";
                    refStatus.className = "text-[10px] ml-4 font-bold text-red-500";
                }
            } else {
                refStatus.classList.add('hidden');
            }
        });

        // Trigger Account creation
        window.handleSignUp = async () => {
            const otpCode = document.getElementById('otp').value.trim();
            const uname = usernameInput.value.trim();
            const pass = passwordInput.value;
            const phone = phoneInput.value;
            const refEntered = referralInput.value.trim();

            if (!confirmationResult) {
                showError("Please request an OTP first.");
                return;
            }
            if (otpCode.length !== 6) {
                showError("Enter a valid 6-digit OTP.");
                return;
            }

            try {
                // Complete OTP Check
                const result = await confirmationResult.confirm(otpCode);
                const user = result.user;

                // Generate completely unique referral code for this new user
                const userRefCode = generateReferralCode();

                // Save secure data schema in firestore database
                await setDoc(doc(db, "users", phone), {
                    uid: user.uid,
                    username: uname,
                    password: pass, // Ideally should be hashed, stored directly based on requirement
                    phone: phone,
                    balance: 130, // Starting Sign Up reward ₹130 matching dashboard
                    myReferralCode: userRefCode,
                    referredBy: refEntered || "none",
                    createdAt: new Date().toISOString()
                });

                // Set local login persistence session
                sessionStorage.setItem("isLoggedIn", "true");
                sessionStorage.setItem("userPhone", phone);

                // Redirect dynamically to main portal
                window.location.href = "dashboard.html";

            } catch (err) {
                showError("Invalid OTP entered. Please try again.");
            }
        };

        // Utility error messaging function
        function showError(msg, show = true, color = "red") {
            const toast = document.getElementById('error-toast');
            const text = document.getElementById('error-text');
            if (!show) {
                toast.classList.add('hidden');
                return;
            }
            toast.classList.remove('hidden', 'bg-red-100', 'border-red-200', 'text-red-700', 'bg-emerald-100', 'border-emerald-200', 'text-emerald-700');
            
            if (color === "green") {
                toast.classList.add('bg-emerald-100', 'border-emerald-200', 'text-emerald-700');
            } else {
                toast.classList.add('bg-red-100', 'border-red-200', 'text-red-700');
            }
            text.innerText = msg;
        }
    </script>
</body>
</html>
