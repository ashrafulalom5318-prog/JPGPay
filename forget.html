<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - JPGPay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;750;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f3f7f6;
            user-select: none;
        }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen md:bg-gray-900">

    <div class="relative w-full max-w-md h-screen md:h-[880px] md:rounded-[36px] bg-[#f4f7f9] md:shadow-2xl overflow-hidden flex flex-col p-6 justify-between">
        
        <div class="flex items-center mb-6">
            <a href="login.html" class="text-emerald-800 text-xl"><i class="fa-solid fa-arrow-left"></i></a>
            <h2 class="text-lg font-bold text-[#0a8f5c] mx-auto pr-6">Reset Password</h2>
        </div>

        <div class="space-y-4 flex-1">
            <div id="error-toast" class="hidden bg-red-100 border border-red-200 text-red-700 text-xs px-4 py-3 rounded-xl flex items-center space-x-2">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="error-text"></span>
            </div>

            <!-- Phone Section -->
            <div class="flex items-center bg-white border border-gray-200 rounded-full px-5 py-3.5 shadow-sm">
                <i class="fa-solid fa-phone text-[#0a8f5c] mr-3 text-lg"></i>
                <span class="text-[#0a8f5c] font-bold text-sm border-r pr-3 mr-3">+91</span>
                <input type="tel" id="phone" placeholder="Phone" maxlength="10" class="w-full bg-transparent outline-none text-gray-700 text-sm tracking-widest">
            </div>

            <!-- New Password Section -->
            <div class="flex items-center bg-white border border-gray-200 rounded-full px-5 py-3.5 shadow-sm">
                <i class="fa-solid fa-lock text-[#0a8f5c] mr-3.5 text-lg"></i>
                <input type="password" id="new-password" placeholder="New Password" class="w-full bg-transparent outline-none text-gray-700 text-sm">
            </div>

            <!-- OTP Input Row -->
            <div class="flex items-center bg-white border border-gray-200 rounded-full px-5 py-2.5 shadow-sm">
                <i class="fa-regular fa-envelope text-[#0a8f5c] mr-3.5 text-lg"></i>
                <input type="tel" id="otp" placeholder="OTP Code" maxlength="6" class="w-full bg-transparent outline-none text-gray-700 text-sm tracking-widest">
                <button id="send-btn" disabled class="bg-[#9cd3bc] cursor-not-allowed text-white text-xs px-5 py-2 rounded-full font-bold">Send</button>
            </div>
        </div>

        <button onclick="handleReset()" class="w-full bg-[#0a8f5c] hover:bg-emerald-800 text-white font-bold py-4 rounded-full shadow-lg transition-all text-center block text-sm mt-6">
            Reset Password
        </button>

        <div id="recaptcha-container"></div>
    </div>

    <!-- Script Operations for Forgot OTP integration & Password Updates -->
    <script type="module">
        import { auth, db, RecaptchaVerifier, signInWithPhoneNumber, doc, getDoc, updateDoc } from "./services/firebase-config.js";

        const phoneInp = document.getElementById('phone');
        const sendBtn = document.getElementById('send-btn');
        const newPassInp = document.getElementById('new-password');
        let confirmationResult = null;

        phoneInp.addEventListener('input', () => {
            phoneInp.value = phoneInp.value.replace(/[^0-9]/g, '');
            if (phoneInp.value.length === 10) {
                sendBtn.disabled = false;
                sendBtn.classList.remove('bg-[#9cd3bc]', 'cursor-not-allowed');
                sendBtn.classList.add('bg-[#0a8f5c]');
            } else {
                sendBtn.disabled = true;
                sendBtn.classList.add('bg-[#9cd3bc]', 'cursor-not-allowed');
                sendBtn.classList.remove('bg-[#0a8f5c]');
            }
        });

        // Initialize Invisible Captcha
        window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', { 'size': 'invisible' });

        sendBtn.addEventListener('click', async () => {
            const phoneVal = phoneInp.value.trim();
            showError("", false);

            try {
                // Check database if user already exists
                const userDocRef = doc(db, "users", phoneVal);
                const userSnap = await getDoc(userDocRef);

                if (!userSnap.exists()) {
                    showError("No account registered with this phone number.");
                    return;
                }

                if (newPassInp.value.length < 6) {
                    showError("Enter a strong new password (min 6 characters).");
                    return;
                }

                const phoneNumber = "+91" + phoneVal;
                const appVerifier = window.recaptchaVerifier;
                confirmationResult = await signInWithPhoneNumber(auth, phoneNumber, appVerifier);
                
                showError("OTP Sent Successfully!", true, "green");
            } catch (err) {
                showError("Error: " + err.message);
            }
        });

        window.handleReset = async () => {
            const otpCode = document.getElementById('otp').value.trim();
            const phoneVal = phoneInp.value.trim();
            const newPassword = newPassInp.value;

            if (!confirmationResult) {
                showError("Verify phone and send OTP first.");
                return;
            }
            if (otpCode.length !== 6) {
                showError("Enter correct 6-digit OTP.");
                return;
            }

            try {
                await confirmationResult.confirm(otpCode);

                // Verification successful. Update Firestore document values
                const userDocRef = doc(db, "users", phoneVal);
                await updateDoc(userDocRef, {
                    password: newPassword
                });

                showError("Password changed successfully! Redirecting to Login...", true, "green");
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 2000);

            } catch (err) {
                showError("Verification failed. Invalid OTP code.");
            }
        };

        function showError(msg, show = true, color = "red") {
            const toast = document.getElementById('error-toast');
            const text = document.getElementById('error-text');
            if (!show) {
                toast.classList.add('hidden');
                return;
            }
            toast.classList.remove('hidden', 'bg-red-100', 'border-red-200', 'text-red-700', 'bg-emerald-100', 'border-emerald-200', 'text-emerald-700');
            if (color === "green") {
                toast.classList.add('bg-emerald-100', 'border-emerald-200', 'text-emerald-700');
            } else {
                toast.classList.add('bg-red-100', 'border-red-200', 'text-red-700');
            }
            text.innerText = msg;
        }
    </script>
</body>
</html>
